name: CI

# Runs on every pull request and on main. The checks are the ones docs/BRANCHING.md asks for before a PR:
# typecheck + tests of the core, and the Kotlin tests (which start the real Node server) plus the web compile.
on:
  pull_request:
  push:
    branches: [main]
  workflow_call: # the release workflow runs the same checks before it builds anything

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (TypeScript)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # A per-test limit and a live reporter, so a slow test is named in the log; the step limit ends a test file that never exits within minutes (a normal run takes well under one).
      - run: npm test -- --test-reporter=spec --test-timeout=180000
        timeout-minutes: 8

  apps:
    name: Apps (Kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: The compiled agent (the desktop app starts it from here in the tests)
        run: |
          npm ci
          npm run build:mobile
      - name: Desktop tests (they start the real Node server) and web compile
        working-directory: ui
        run: bash ./gradlew :composeApp:desktopTest :composeApp:compileKotlinWasmJs --console=plain
